<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>YouTube AI Assistant with Vision</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; padding: 20px; }
    #chatbox { width: 100%; max-width: 650px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 85vh; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #2563eb; align-self: flex-end; }
    .bot { background: #334155; align-self: flex-start; }
    .preview-img { max-width: 150px; border-radius: 6px; margin-top: 5px; display: block; }
    #input-area { display: flex; align-items: center; padding: 12px; border-top: 1px solid #334155; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: none; outline: none; background: #0f172a; color: #fff; }
    .file-btn { background: #475569; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
    button { padding: 12px 18px; background: #22c55e; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
    #file-name { font-size: 11px; color: #38bdf8; }
  </style>
</head>
<body>

<div id="chatbox">
  <div id="messages">
    <div class="msg bot">নমস্কার! আমি আপনার ইউটিউব কনটেন্ট সহকারী। যেকোনো প্রশ্ন করতে পারেন অথবা ছবি/থাম্বনেইল আপলোড করতে পারেন! 📷</div>
  </div>
  <div id="file-name" style="padding: 0 15px;"></div>
  <div id="input-area">
    <label class="file-btn">
      📷 ছবি দিন
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="showFileName()">
    </label>
    <input type="text" id="userInput" placeholder="প্রশ্ন লিখুন বা ছবি পাঠিয়ে মতামত চান..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">পাঠান</button>
  </div>
</div>

<script>
let base64Image = null;
let imageMimeType = null;

function showFileName() {
  const file = document.getElementById("imageInput").files[0];
  if (file) {
    document.getElementById("file-name").innerText = "নির্বাচিত ছবি: " + file.name;
    const reader = new FileReader();
    reader.onload = function(e) {
      const parts = e.target.result.split(",");
      base64Image = parts[1];
      imageMimeType = file.type;
    };
    reader.readAsDataURL(file);
  }
}

async function send() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  const fileInput = document.getElementById("imageInput");

  if (!text && !base64Image) return;

  const msgBox = document.getElementById("messages");
  
  let userHtml = `<div class="msg user">${text}`;
  if (base64Image) {
    userHtml += `<br><img class="preview-img" src="data:${imageMimeType};base64,${base64Image}">`;
  }
  userHtml += `</div>`;
  msgBox.innerHTML += userHtml;

  const payload = {
    message: text || "এই ছবি বা থাম্বনেইলটি বিশ্লেষণ করে ক্রিয়েটর হিসেবে মতামত দাও।",
    image: base64Image ? { data: base64Image, mimeType: imageMimeType } : null
  };

  input.value = "";
  document.getElementById("file-name").innerText = "";
  base64Image = null;
  imageMimeType = null;
  fileInput.value = "";
  msgBox.scrollTop = msgBox.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    msgBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
  } catch (err) {
    msgBox.innerHTML += `<div class="msg bot">ত্রুটি: সার্ভারে যোগাযোগ করা যায়নি।</div>`;
  }
  msgBox.scrollTop = msgBox.scrollHeight;
}
</script>
</body>
</html>
