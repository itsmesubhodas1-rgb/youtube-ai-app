<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head><link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
<body class="bg-slate-900 text-white flex flex-col h-screen overflow-hidden">

  <!-- লগইন ওভারলে -->
  <div id="loginOverlay" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full text-center">
      <div class="w-16 h-16 bg-red-600/10 text-red-500 rounded-full flex items-center justify-center mb-4">
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
      </div>
      <h2 class="text-2xl font-bold mb-2">YouTube AI Assistant</h2>
      <p class="text-slate-400 text-sm mb-6">অ্যাপটি ব্যবহার করার জন্য গুগল দিয়ে সাইন-ইন করুন।</p>
      
      <div id="g_id_onload"
           data-client_id="231722960025-hqt16pajnl4kg9lddoa3flppj4ttof8n.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>
  </div>

  <!-- হেডার -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 py-3 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
      <h1 class="font-bold text-lg hidden sm:inline">YouTube AI Assistant</h1>
    </div>
    
    <div class="flex items-center gap-2">
      <select id="aspectRatioSelect" class="bg-slate-700 border border-slate-600 text-xs rounded-xl px-2 py-1.5 text-white outline-none cursor-pointer">
        <option value="9:16">📱 9:16 (Shorts)</option>
        <option value="16:9">🖥️ 16:9 (Video)</option>
        <option value="1:1" selected>⏹️ 1:1 (Square)</option>
      </select>

      <select id="languageSelect" onchange="changeLanguage(this.value)" class="bg-slate-700 border border-slate-600 text-xs rounded-xl px-2 py-1.5 text-white outline-none cursor-pointer">
        <option value="Bengali" selected>🇧🇩 বাংলা</option>
        <option value="English">🇺🇸 English</option>
        <option value="Hindi">🇮🇳 हिंदी</option>
      </select>

      <button onclick="clearChat()" title="Clear Chat" class="p-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl text-slate-300 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>

      <div id="userProfile" class="hidden flex items-center gap-2">
        <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-slate-600 object-cover" alt="User">
        <button id="logoutBtn" onclick="logOut()" class="text-xs bg-red-600/80 hover:bg-red-500 px-2 py-1 rounded-lg border border-red-500/50 transition">লগআউট</button>
      </div>
    </div>
  </header>

  <!-- কুইক বাটন ও এসইও বাটন -->
  <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex items-center gap-2 overflow-x-auto text-xs no-scrollbar">
    <button onclick="requestSeoPrompt()" class="whitespace-nowrap bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3.5 py-1.5 rounded-full flex items-center gap-1 shadow-sm transition">
      ⚡ SEO Pack
    </button>
    <button onclick="sendQuickPrompt('একটি ভাইরাল কমেডি শর্টসের স্ক্রিপ্ট লিখে দাও')" class="whitespace-nowrap bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">🎬 ভাইরাল স্ক্রিপ্ট</button>
    <button onclick="sendQuickPrompt('রান্নাঘরে আলু ও পটলের ঝগড়ার মজার 3D ছবি বানাও')" class="whitespace-nowrap bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">🥔 আলু-পটল 3D ছবি</button>
    <button onclick="sendQuickPrompt('ইউটিউব শর্টস ভাইরাল করার সেরা ১০টি ট্রেন্ডিং হ্যাশট্যাগ ও ট্যাগ দাও')" class="whitespace-nowrap bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-full text-slate-300">🏷️ ভাইরাল হ্যাশট্যাগ</button>
  </div>

  <!-- চ্যাট স্ক্রিন -->
  <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
    <div class="flex items-start gap-3">
      <div id="welcomeMessage" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 max-w-[85%] text-slate-200 text-sm leading-relaxed">
        নমস্কার! আমি আপনার ইউটিউব সহকারী। ছবি তৈরি করতে লিখুন “ছবি বানাও...” 🎨 অথবা সম্পূর্ণ এসইও প্যাক পেতে ওপরের “⚡ SEO Pack” বাটনে চাপুন!
      </div>
    </div>
  </main>

  <!-- ইমেজ প্রিভিউ -->
  <div id="previewContainer" class="hidden px-4 py-2 bg-slate-800/90 border-t border-slate-700 max-w-4xl mx-auto w-full flex items-center gap-3">
    <img id="imagePreview" src="" alt="Preview" class="h-16 w-16 object-cover rounded-xl border border-slate-600">
    <button id="removeImage" class="text-xs text-red-400 hover:text-red-300 font-medium">ছবি বাতিল করুন</button>
  </div>

  <!-- ইনপুট বার -->
  <footer class="p-4 bg-slate-900 border-t border-slate-800">
    <form id="chatForm" class="max-w-4xl mx-auto flex items-center gap-2 bg-slate-800/80 p-2 rounded-2xl border border-slate-700">
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      
      <button type="button" onclick="document.getElementById('imageInput').click()" class="p-2.5 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </button>

      <button type="button" id="micBtn" onclick="toggleSpeech()" class="p-2.5 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl transition">
        <svg id="micIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
      </button>

      <input type="text" id="userInput" placeholder="প্রশ্ন লিখুন অথবা ভিডিওর টপিক দিন..." class="flex-1 bg-transparent border-none outline-none px-2 text-white placeholder-slate-500 text-sm">
      
      <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white p-2.5 rounded-xl transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      </button>
    </form>
  </footer>

  <script>
    const loginOverlay = document.getElementById("loginOverlay");
    const userProfile = document.getElementById("userProfile");
    const userAvatar = document.getElementById("userAvatar");
    const languageSelect = document.getElementById("languageSelect");
    const aspectRatioSelect = document.getElementById("aspectRatioSelect");
    const welcomeMessage = document.getElementById("welcomeMessage");
    const userInput = document.getElementById("userInput");
    const logoutBtn = document.getElementById("logoutBtn");
    const micBtn = document.getElementById("micBtn");
    const micIcon = document.getElementById("micIcon");

    const langData = {
      Bengali: {
        welcome: "নমস্কার! আমি আপনার ইউটিউব সহকারী। ছবি তৈরি করতে লিখুন “ছবি বানাও...” 🎨 অথবা সম্পূর্ণ এসইও প্যাক পেতে ওপরের “⚡ SEO Pack” বাটনে চাপুন!",
        placeholder: "প্রশ্ন লিখুন অথবা ভিডিওর টপিক দিন...",
        logout: "লগআউট",
        loading: "ভাবছি...",
        copy: "কপি করুন",
        download: "ছবি ডাউনলোড করুন",
        speechLang: "bn-IN"
      },
      English: {
        welcome: "Hello! I am your YouTube Assistant. Type 'create an image...' 🎨 or click '⚡ SEO Pack' above for full optimization!",
        placeholder: "Ask a question or enter video topic...",
        logout: "Log Out",
        loading: "Thinking...",
        copy: "Copy",
        download: "Download Image",
        speechLang: "en-US"
      },
      Hindi: {
        welcome: "नमस्ते! मैं आपका यूट्यूब असिस्टेंट हूँ। चित्र बनाने के लिए लिखें 'चित्र बनाएं...' 🎨 या '⚡ SEO Pack' पर क्लिक करें!",
        placeholder: "प्रश्न पूछें या वीडियो का विषय दर्ज करें...",
        logout: "लॉगआउट",
        loading: "सोच रहा हूँ...",
        copy: "कॉपी करें",
        download: "डाउनलोड करें",
        speechLang: "hi-IN"
      }
    };

    function changeLanguage(lang) {
      const data = langData[lang] || langData.Bengali;
      welcomeMessage.innerText = data.welcome;
      userInput.placeholder = data.placeholder;
      logoutBtn.innerText = data.logout;
      localStorage.setItem("selected_lang", lang);
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const user = parseJwt(response.credential);
      localStorage.setItem("user_info", JSON.stringify(user));
      showAuthenticatedUser(user);
    }

    function showAuthenticatedUser(user) {
      userAvatar.src = user.picture;
      userProfile.classList.remove("hidden");
      loginOverlay.classList.add("hidden");
    }

    function logOut() {
      localStorage.removeItem("user_info");
      location.reload();
    }

    function clearChat() {
      chatBox.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 max-w-[85%] text-slate-200 text-sm leading-relaxed">
            ${(langData[languageSelect.value] || langData.Bengali).welcome}
          </div>
        </div>
      `;
    }

    function sendQuickPrompt(promptText) {
      userInput.value = promptText;
      chatForm.dispatchEvent(new Event('submit'));
    }

    function requestSeoPrompt() {
      const topic = prompt("আপনার ইউটিউব ভিডিওর বিষয়টি (Topic) লিখুন:");
      if (topic && topic.trim()) {
        userInput.value = `এই ভিডিও টপিকের জন্য সম্পূর্ণ YouTube SEO Pack দাও: "${topic.trim()}"`;
        chatForm.dispatchEvent(new Event('submit'));
      }
    }

    function speakText(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = (langData[languageSelect.value] || langData.Bengali).speechLang;
      window.speechSynthesis.speak(utterance);
    }

    let recognition;
    let isListening = false;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micIcon.classList.add("text-red-500", "animate-pulse");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value += (userInput.value ? " " : "") + transcript;
      };

      recognition.onend = () => {
        isListening = false;
        micIcon.classList.remove("text-red-500", "animate-pulse");
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert("ভয়েস টাইপিং ব্যবহারের জন্য Chrome ব্রাউজার ব্যবহার করুন।");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.lang = (langData[languageSelect.value] || langData.Bengali).speechLang;
        recognition.start();
      }
    }

    window.onload = function() {
      const savedUser = localStorage.getItem("user_info");
      if (savedUser) showAuthenticatedUser(JSON.parse(savedUser));
      const savedLang = localStorage.getItem("selected_lang") || "Bengali";
      languageSelect.value = savedLang;
      changeLanguage(savedLang);
    };

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const imageInput = document.getElementById("imageInput");
    const previewContainer = document.getElementById("previewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const removeImage = document.getElementById("removeImage");

    let base64Image = null;

    imageInput.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          base64Image = evt.target.result;
          imagePreview.src = base64Image;
          previewContainer.classList.remove("hidden");
        };
        reader.readAsDataURL(file);
      }
    });

    removeImage.addEventListener("click", () => {
      base64Image = null;
      imageInput.value = "";
      previewContainer.classList.add("hidden");
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text && !base64Image) return;

      appendUserMessage(text, base64Image);
      userInput.value = "";
      const currentImage = base64Image;
      base64Image = null;
      imageInput.value = "";
      previewContainer.classList.add("hidden");

      const loadingId = appendLoadingMessage();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            message: text, 
            image: currentImage,
            language: languageSelect.value,
            aspectRatio: aspectRatioSelect.value
          })
        });
        const data = await res.json();
        removeMessage(loadingId);
        appendBotMessage(data.reply, data.generatedImage);
      } catch (err) {
        removeMessage(loadingId);
        appendBotMessage("ত্রুটি: সার্ভারে যোগাযোগ করা সম্ভব হয়নি।");
      }
    });

    function appendUserMessage(text, imageSrc) {
      const div = document.createElement("div");
      div.className = "flex justify-end";
      let imgHTML = imageSrc ? `<img src="${imageSrc}" class="w-48 h-48 object-cover rounded-xl mb-2 border border-blue-400">` : "";
      div.innerHTML = `
        <div class="bg-blue-600 text-white p-3 rounded-2xl max-w-[85%] text-sm">
          ${imgHTML}
          <p>${text}</p>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendBotMessage(text, generatedImageUrl) {
      const curLang = languageSelect.value;
      const downloadText = (langData[curLang] || langData.Bengali).download;
      const copyText = (langData[curLang] || langData.Bengali).copy;

      const div = document.createElement("div");
      div.className = "flex items-start gap-3";

      let imgHTML = "";
      if (generatedImageUrl) {
        imgHTML = `
          <div class="mt-3">
            <img src="${generatedImageUrl}" class="max-w-xs sm:max-w-md w-full rounded-xl border border-slate-600 shadow-lg object-contain">
            <a href="${generatedImageUrl}" target="_blank" download="generated-image.jpg" class="mt-2 inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg transition font-medium">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              ${downloadText}
            </a>
          </div>
        `;
      }

      div.innerHTML = `
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 max-w-[85%] text-slate-200 text-sm">
          <div class="whitespace-pre-wrap leading-relaxed">${formatSeoText(text)}</div>
          ${imgHTML}
          <div class="mt-3 flex gap-3 pt-2 border-t border-slate-700/60">
            <button onclick="navigator.clipboard.writeText(this.closest('.bg-slate-800').innerText)" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              ${copyText}
            </button>
            <button onclick="speakText(this.closest('.bg-slate-800').innerText)" class="text-xs text-slate-400 hover:text-cyan-400 flex items-center gap-1 transition" title="Listen Voice">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
              শুনুন
            </button>
          </div>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function formatSeoText(raw) {
      return raw.replace(/\*\*(.*?)\*\*/g, '<strong class="text-cyan-400 font-semibold">$1</strong>');
    }

    function appendLoadingMessage() {
      const curLang = languageSelect.value;
      const loadText = (langData[curLang] || langData.Bengali).loading;

      const id = "loading-" + Date.now();
      const div = document.createElement("div");
      div.id = id;
      div.className = "flex items-start gap-3";
      div.innerHTML = `
        <div class="bg-slate-800 px-4 py-3 rounded-2xl border border-slate-700 flex items-center gap-2 text-slate-400 text-sm">
          <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
          ${loadText}
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
