<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube AI Assistant with Vision</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 15px 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 1.2rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 15px;
      position: relative;
      word-wrap: break-word;
    }
    .user {
      background-color: #2563eb;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .bot {
      background-color: #1e293b;
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #334155;
    }
    .bot-content {
      white-space: pre-wrap;
    }
    .copy-btn {
      margin-top: 8px;
      background-color: #334155;
      border: none;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background-color: #475569;
      color: #fff;
    }
    .image-preview-container {
      padding: 10px 20px 0;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .preview-box {
      position: relative;
      display: inline-block;
    }
    .preview-box img {
      height: 60px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
    }
    .remove-img {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }
    #input-container {
      background-color: #1e293b;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    #file-input {
      display: none;
    }
    .upload-btn {
      background-color: #334155;
      color: #38bdf8;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .upload-btn:hover {
      background-color: #475569;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    #user-input:focus {
      border-color: #38bdf8;
    }
    #send-btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    #send-btn:hover {
      background-color: #059669;
    }
    #send-btn:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-brands fa-youtube" style="color: #ef4444;"></i> YouTube AI Assistant</h1>
  </header>

  <div id="chat-container">
    <div class="message bot">
      <div class="bot-content">নমস্কার! আমি আপনার ইউটিউব কনটেন্ট সহকারী। যেকোনো প্রশ্ন করতে পারেন অথবা ছবি/থাম্বনেইল আপলোড করে পরামর্শ নিতে পারেন! 🎬</div>
    </div>
  </div>

  <div class="image-preview-container" id="preview-area">
    <div class="preview-box">
      <img id="preview-img" src="" alt="Preview">
      <div class="remove-img" onclick="clearImage()">✕</div>
    </div>
  </div>

  <div id="input-container">
    <input type="file" id="file-input" accept="image/*" onchange="handleImage(event)">
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">
      <i class="fa-solid fa-image"></i> ছবি দিন
    </button>
    <input type="text" id="user-input" placeholder="প্রশ্ন লিখুন বা ছবি পাঠিয়ে মতামত চান..." onkeypress="handleEnter(event)">
    <button id="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    let selectedImageBase64 = null;

    function handleImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        selectedImageBase64 = event.target.result;
        document.getElementById("preview-img").src = selectedImageBase64;
        document.getElementById("preview-area").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageBase64 = null;
      document.getElementById("file-input").value = "";
      document.getElementById("preview-area").style.display = "none";
    }

    function handleEnter(e) {
      if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      const sendBtn = document.getElementById("send-btn");

      if (!text && !selectedImageBase64) return;

      const chatContainer = document.getElementById("chat-container");
      const userMsgDiv = document.createElement("div");
      userMsgDiv.className = "message user";
      if (text) userMsgDiv.innerText = text;
      if (selectedImageBase64) {
        const userImg = document.createElement("img");
        userImg.src = selectedImageBase64;
        userImg.style.maxWidth = "100%";
        userImg.style.borderRadius = "6px";
        userImg.style.marginTop = text ? "8px" : "0px";
        userMsgDiv.appendChild(userImg);
      }
      chatContainer.appendChild(userMsgDiv);

      const postData = {
        message: text,
        image: selectedImageBase64
      };

      input.value = "";
      clearImage();
      chatContainer.scrollTop = chatContainer.scrollHeight;

      sendBtn.disabled = true;
      const botMsgDiv = document.createElement("div");
      botMsgDiv.className = "message bot";
      botMsgDiv.innerHTML = `<div class="bot-content">চিন্তাভাবনা করছি... ⏳</div>`;
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(postData)
        });
        const data = await res.json();
        
        if (data.reply) {
          botMsgDiv.innerHTML = `
            <div class="bot-content">${escapeHTML(data.reply)}</div>
            <button class="copy-btn" onclick="copyReply(this)"><i class="fa-regular fa-copy"></i> কপি করুন</button>
          `;
        } else {
          botMsgDiv.innerHTML = `<div class="bot-content">ত্রুটি: উত্তর পাওয়া যায়নি।</div>`;
        }
      } catch (err) {
        botMsgDiv.innerHTML = `<div class="bot-content">ত্রুটি: সার্ভারে যোগাযোগ করা যায়নি।</div>`;
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function copyReply(btn) {
      const textToCopy = btn.previousElementSibling.innerText;
      navigator.clipboard.writeText(textToCopy).then(() => {
        btn.innerHTML = `<i class="fa-solid fa-check"></i> কপি হয়েছে!`;
        setTimeout(() => {
          btn.innerHTML = `<i class="fa-regular fa-copy"></i> কপি করুন`;
        }, 2000);
      });
    }
  </script>
</body>
</html>
